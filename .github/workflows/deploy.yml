name: Deploy Aurora Blog to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────
# 独立仓库部署：以下变量一个都不用配，保持默认即可。
# 想把博客塞进「已有仓库 / 已有站点」时，在
#   Settings → Secrets and variables → Actions → Variables
# 里按需添加（全部可选）：
#   BLOG_DIR          博客源码在仓库里的子目录，例如 blog
#   PAGES_SUBPATH     博客在站点内的子路径，例如 blog（旧内容留在站点根）
#   PAGES_LEGACY_DIR  旧站点静态文件所在目录，例如 legacy（会被一起打包）
#   VITE_POSTS_DIR    覆盖后台发布路径（一般会自动推导，无需手填）
#   VITE_HASH_ROUTER  强制 true / false 覆盖共存模式下的路由策略
#   TWIKOO_ENV_ID     Twikoo 环境 ID
# ─────────────────────────────────────────────────────────────
env:
  BLOG_DIR: ${{ vars.BLOG_DIR || '.' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ vars.BLOG_DIR || '.' }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.BLOG_DIR }}
        run: npm ci

      # A project page lives at /<repo>/, a user page at /.
      # When PAGES_SUBPATH is set, the blog lives at /<repo>/<sub>/ instead.
      - name: Resolve deployment target
        env:
          SUBPATH_IN: ${{ vars.PAGES_SUBPATH || '' }}
          POSTS_DIR_IN: ${{ vars.VITE_POSTS_DIR || '' }}
          HASH_IN: ${{ vars.VITE_HASH_ROUTER || '' }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          SUBPATH="${SUBPATH_IN#/}"; SUBPATH="${SUBPATH%/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          if [[ -n "$SUBPATH" ]]; then BASE="${BASE}${SUBPATH}/"; fi
          echo "VITE_BASE=$BASE" >> "$GITHUB_ENV"

          BLOG_DIR="${BLOG_DIR#./}"; BLOG_DIR="${BLOG_DIR%/}"
          if [[ -n "$POSTS_DIR_IN" ]]; then
            echo "VITE_POSTS_DIR=$POSTS_DIR_IN" >> "$GITHUB_ENV"
          elif [[ -n "$BLOG_DIR" && "$BLOG_DIR" != "." ]]; then
            # Source lives in a subfolder: admin publishing must target the same folder.
            echo "VITE_POSTS_DIR=$BLOG_DIR/src/content/posts" >> "$GITHUB_ENV"
          fi

          # In coexist mode the site-root 404.html belongs to the legacy site,
          # so hash routing keeps deep links working without touching it.
          if [[ -n "$HASH_IN" ]]; then
            echo "VITE_HASH_ROUTER=$HASH_IN" >> "$GITHUB_ENV"
          elif [[ -n "$SUBPATH" ]]; then
            echo "VITE_HASH_ROUTER=true" >> "$GITHUB_ENV"
          fi
          echo "Base: $BASE | blog dir: ${BLOG_DIR:-.} | subpath: ${SUBPATH:-<root>}"

      - name: Build site
        working-directory: ${{ env.BLOG_DIR }}
        run: npm run build
        env:
          VITE_TWIKOO_ENV_ID: ${{ vars.TWIKOO_ENV_ID || '' }}
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}

      # Assemble the final Pages artifact. _site is the site root.
      # In coexist mode legacy files keep the root and the blog is nested.
      - name: Assemble Pages artifact
        env:
          SUBPATH: ${{ vars.PAGES_SUBPATH || '' }}
          LEGACY_DIR: ${{ vars.PAGES_LEGACY_DIR || '' }}
        run: |
          set -euo pipefail
          SUBPATH="${SUBPATH#/}"; SUBPATH="${SUBPATH%/}"
          LEGACY_DIR="${LEGACY_DIR#./}"; LEGACY_DIR="${LEGACY_DIR%/}"
          BLOG_DIR="${BLOG_DIR#./}"; BLOG_DIR="${BLOG_DIR%/}"
          [[ -z "$BLOG_DIR" ]] && BLOG_DIR="."

          rm -rf _site
          mkdir -p _site
          if [[ -n "$LEGACY_DIR" && -d "$LEGACY_DIR" ]]; then
            cp -a "$LEGACY_DIR"/. _site/
            echo "Merged legacy site files from $LEGACY_DIR/"
          fi
          if [[ -n "$SUBPATH" ]]; then
            mkdir -p "_site/$SUBPATH"
            cp -a "$BLOG_DIR"/dist/. "_site/$SUBPATH/"
            echo "Blog nested under /$SUBPATH/"
          else
            cp -a "$BLOG_DIR"/dist/. _site/
            echo "Blog at site root"
          fi
          # GitHub Pages would otherwise run Jekyll and ignore _-prefixed assets.
          touch _site/.nojekyll
          echo "=== artifact top level ==="
          ls -A _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
