<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aurora Blog — 基于 Vue 3 的现代化静态博客" />
    <meta name="theme-color" content="#f7f8fd" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Aurora Blog</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('aurora-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0a0d18' : '#f7f8fd');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      #boot-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f7f8fd;transition:opacity .55s ease,visibility .55s ease}
      html[data-theme="dark"] #boot-loader{background:#0a0d18}
      .boot-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
      .boot-ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 0deg,#6366f1,#06b6d4,#a855f7,#6366f1);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0);animation:boot-spin 1.1s linear infinite}
      .boot-text{font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.32em;color:#6366f1;text-transform:uppercase}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      html.app-ready #boot-loader{opacity:0;visibility:hidden;pointer-events:none}
      @media (prefers-reduced-motion:reduce){.boot-ring{animation-duration:3s}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-inner">
        <div class="boot-ring"></div>
        <div class="boot-text">Aurora</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
